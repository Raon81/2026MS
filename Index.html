<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap">
<style>
  :root {
    --dawn: #E8EEF6;
    --dawn-deep: #D3DEEC;
    --ink: #1E2B45;
    --mist: #6F7D96;
    --line: #CBD5E3;
    --paper: #FFFFFF;
    --sun: #FFC845;
    --sun-soft: #FFF3CC;
    --seal: #CF3B2B;
    --sans: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --serif: "Gowun Batang", "AppleMyungjo", "Batang", serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: var(--sans);
    background: var(--dawn);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  .hidden { display: none !important; }
  .vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 18px; }

  /* ── 첫 화면 ── */
  #loginView { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  .horizon {
    position: relative; height: 38vh; min-height: 220px; overflow: hidden;
    background: linear-gradient(#BFD0E6, var(--dawn));
  }
  .horizon .sun {
    position: absolute; left: 50%; bottom: -70px; width: 170px; height: 170px;
    margin-left: -85px; border-radius: 50%; background: var(--sun);
    box-shadow: 0 0 0 18px rgba(255, 200, 69, .25), 0 0 0 40px rgba(255, 200, 69, .12);
    animation: rise 1.4s cubic-bezier(.2,.7,.2,1) both;
  }
  .horizon::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--ink); opacity: .85;
  }
  @keyframes rise { from { transform: translateY(70px); } to { transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { .horizon .sun { animation: none; } }

  .login-body { padding-top: 28px; padding-bottom: 40px; flex: 1; }
  .login-body h1 { font-family: var(--serif); font-size: 32px; line-height: 1.25; margin: 0 0 6px; letter-spacing: -0.01em; }
  .login-body .lead { margin: 0 0 28px; color: var(--mist); }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-weight: 600; margin-bottom: 8px; }
  .text-input {
    width: 100%; height: 54px; padding: 0 16px; font-size: 18px;
    border: 2px solid var(--ink); border-radius: 12px; background: var(--paper);
  }
  .text-input.pin { letter-spacing: .5em; font-size: 22px; }
  .text-input.pin::placeholder { letter-spacing: .3em; }
  .setup { border-left: 4px solid var(--sun); padding-left: 14px; margin-bottom: 4px; }
  .setup p { margin: 0 0 12px; font-size: 15px; }
  .btn.full { width: 100%; margin-top: 4px; }
  .hint { font-size: 14px; color: var(--mist); margin: 12px 0 0; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 48px; padding: 0 18px; border-radius: 12px; border: 2px solid var(--ink);
    background: var(--paper); font-weight: 700; white-space: nowrap;
  }
  .btn.primary { background: var(--ink); color: #fff; }
  .btn.big { height: 54px; font-size: 17px; padding: 0 22px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn:active:not(:disabled) { transform: translateY(1px); }

  /* ── 메인 상단 ── */
  .top { padding-top: calc(18px + env(safe-area-inset-top, 0px)); padding-bottom: 16px; }
  .top-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .hello { font-size: 15px; color: var(--mist); margin: 0; }
  .nick { font-family: var(--serif); font-size: 26px; margin: 0; line-height: 1.2; word-break: break-all; }
  .change { background: none; border: 0; padding: 4px 0; color: var(--mist); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
  .tally {
    margin-top: 16px; display: flex; align-items: center; gap: 14px;
    padding: 14px 16px; border-radius: 14px; background: var(--ink); color: #fff;
  }
  .tally .count { font-family: var(--serif); font-size: 40px; line-height: 1; color: var(--sun); }
  .tally .count small { font-size: 18px; margin-left: 2px; color: #fff; }
  .tally p { margin: 0; font-size: 14px; line-height: 1.45; color: #D7DEEA; }
  .tally p strong { color: #fff; font-weight: 600; }

  /* ── 탭 ── */
  .tabs-bar { position: sticky; top: 0; z-index: 10; background: var(--dawn); padding: 8px 0 10px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--dawn-deep); border-radius: 12px; padding: 4px; }
  .tabs button { height: 42px; border: 0; border-radius: 9px; background: none; font-weight: 600; color: var(--mist); }
  .tabs button[aria-selected="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 2px rgba(30,43,69,.15); }

  /* ── 공통 블록 ── */
  .block { background: var(--paper); border-radius: 16px; padding: 18px; margin-bottom: 14px; }
  .block h2 { font-size: 18px; margin: 0 0 12px; }
  .today { margin: 6px 2px 12px; font-weight: 600; color: var(--mist); }

  textarea {
    width: 100%; min-height: 84px; resize: vertical; padding: 12px 14px; font-size: 16px;
    border: 1.5px solid var(--line); border-radius: 12px; background: #FBFCFE;
  }
  textarea:focus { border-color: var(--ink); outline: none; }
  .res-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; gap: 10px; }
  .res-foot .meta { font-size: 13px; color: var(--mist); }

  /* 사진 인증 */
  .photo-frame {
    position: relative; border-radius: 12px; overflow: hidden; background: var(--dawn);
    border: 1.5px dashed var(--line); aspect-ratio: 4 / 3;
    display: flex; align-items: center; justify-content: center; text-align: center;
  }
  .photo-frame.filled { border-style: solid; border-color: transparent; }
  .photo-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-frame .empty { color: var(--mist); font-size: 15px; padding: 0 20px; }
  .photo-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .photo-meta { font-size: 13px; color: var(--mist); margin: 10px 0 0; }

  /* 인증 도장 — 이 앱의 상징 */
  .seal {
    position: absolute; right: 12px; bottom: 12px; width: 78px; height: 78px; border-radius: 50%;
    border: 3px solid var(--seal); color: var(--seal); background: rgba(255,255,255,.82);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: var(--serif); transform: rotate(-12deg); line-height: 1.1;
  }
  .seal b { font-size: 22px; }
  .seal span { font-family: var(--sans); font-size: 10px; font-weight: 700; }
  .seal.stamp-in { animation: stamp .45s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes stamp { from { transform: rotate(-12deg) scale(2.2); opacity: 0; } to { transform: rotate(-12deg) scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .seal.stamp-in { animation: none; } }

  /* 나의 기록 */
  .history { list-style: none; margin: 0; padding: 0; }
  .history li { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--dawn-deep); align-items: center; }
  .history li:first-child { border-top: 0; padding-top: 0; }
  .history .thumb { position: relative; width: 64px; height: 64px; flex: none; border-radius: 10px; overflow: hidden; background: var(--dawn); }
  .history .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .history .thumb .mini-seal {
    position: absolute; right: 3px; bottom: 3px; width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--seal); background: rgba(255,255,255,.85); color: var(--seal);
    font-family: var(--serif); font-size: 11px; display: flex; align-items: center; justify-content: center; transform: rotate(-12deg);
  }
  .history .thumb.none { display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--mist); }
  .history .info { min-width: 0; }
  .history .d { font-weight: 700; font-size: 15px; }
  .history .r { font-size: 14px; color: var(--mist); margin: 2px 0 0; overflow-wrap: anywhere; }
  .empty-note { color: var(--mist); font-size: 15px; margin: 0; }

  /* ── 피드 ── */
  .feed-head { display: flex; align-items: center; justify-content: space-between; margin: 6px 2px 12px; }
  .feed-head p { margin: 0; font-weight: 600; }
  .feed-head p strong { color: var(--seal); }
  .refresh { height: 38px; font-size: 14px; padding: 0 12px; border-width: 1.5px; }
  .day-label { font-family: var(--serif); font-size: 18px; margin: 18px 2px 10px; }
  .day-label:first-child { margin-top: 0; }
  .post { background: var(--paper); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  .post-head { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: none; background: var(--sun-soft);
    display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--ink);
  }
  .post-head .who { font-weight: 700; overflow-wrap: anywhere; }
  .post-head .when { font-size: 13px; color: var(--mist); }
  .post-head .state { margin-left: auto; font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 999px; white-space: nowrap; }
  .state.done { color: var(--seal); border: 1.5px solid var(--seal); }
  .state.wait { color: var(--mist); border: 1.5px solid var(--line); }
  .post .res { margin: 10px 0 0; padding-left: 12px; border-left: 3px solid var(--sun); overflow-wrap: anywhere; }
  .post .pic { margin-top: 10px; border-radius: 12px; overflow: hidden; background: var(--dawn); aspect-ratio: 4 / 3; }
  .post .pic img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
  img.broken { visibility: hidden; }

  /* ── 오버레이 ── */
  #toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 50;
    transform: translate(-50%, 20px); opacity: 0; transition: .25s;
    background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 15px;
    max-width: calc(100% - 36px); width: max-content; text-align: center; pointer-events: none;
  }
  #toast.show { transform: translate(-50%, 0); opacity: 1; }
  #toast.error { background: var(--seal); }
  #loading {
    position: fixed; inset: 0; z-index: 40; background: rgba(232,238,246,.75);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-weight: 600;
  }
  .spinner { width: 40px; height: 40px; border-radius: 50%; border: 4px solid var(--dawn-deep); border-top-color: var(--ink); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #lightbox {
    position: fixed; inset: 0; z-index: 60; background: rgba(15,22,36,.92);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  #lightbox button { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; background: none; border: 0; color: #fff; font-size: 30px; width: 48px; height: 48px; }
</style>
</head>
<body>

<!-- 첫 화면: 닉네임 입력 -->
<section id="loginView">
  <div class="horizon" aria-hidden="true"><div class="sun"></div></div>
  <div class="wrap login-body">
    <h1>아침 공부 인증</h1>
    <p class="lead">오늘 아침 공부, 결심하고 사진으로 남겨요.</p>
    <div class="field">
      <label for="nickInput">닉네임</label>
      <input id="nickInput" class="text-input" maxlength="12" autocomplete="off" enterkeyhint="next" placeholder="닉네임 입력">
    </div>
    <div class="field">
      <label for="pinInput">비밀번호 (숫자 4자리)</label>
      <input id="pinInput" class="text-input pin" type="password" inputmode="numeric" pattern="[0-9]*"
             maxlength="4" autocomplete="off" enterkeyhint="go" placeholder="••••">
    </div>

    <!-- 새 닉네임일 때만 표시 -->
    <div id="setupBox" class="setup hidden">
      <p id="setupMsg"></p>
      <div class="field">
        <label for="pinConfirm">비밀번호 한 번 더 입력</label>
        <input id="pinConfirm" class="text-input pin" type="password" inputmode="numeric" pattern="[0-9]*"
               maxlength="4" autocomplete="off" enterkeyhint="go" placeholder="••••">
      </div>
    </div>

    <button id="loginBtn" class="btn primary big full">시작</button>
    <p class="hint">기록은 닉네임별로 쌓이고, 비밀번호를 아는 사람만 내 기록을 쓸 수 있어요. 비밀번호를 잊으면 선생님께 초기화를 부탁하세요.</p>
  </div>
</section>

<!-- 메인 화면 -->
<section id="mainView" class="hidden">
  <header class="wrap top">
    <div class="top-row">
      <div>
        <p class="hello">좋은 아침이에요,</p>
        <p class="nick" id="nickLabel"></p>
      </div>
      <button class="change" id="changeBtn">나가기</button>
    </div>
    <div class="tally">
      <div class="count"><span id="totalDays">0</span><small>일</small></div>
      <p><strong>누적 공부 일수</strong><br><span id="tallyMsg"></span></p>
    </div>
  </header>

  <div class="tabs-bar">
    <div class="wrap">
      <div class="tabs" role="tablist">
        <button role="tab" id="tabMy" aria-selected="true" aria-controls="panelMy">나의 챌린지</button>
        <button role="tab" id="tabFeed" aria-selected="false" aria-controls="panelFeed">우리 반 피드</button>
      </div>
    </div>
  </div>

  <main class="wrap">
    <!-- 나의 챌린지 -->
    <div id="panelMy" role="tabpanel" aria-labelledby="tabMy">
      <p class="today" id="todayLabel"></p>

      <div class="block">
        <h2>오늘 나의 결심</h2>
        <textarea id="resInput" maxlength="100" placeholder="오늘 아침에 할 공부를 적어 보세요."></textarea>
        <div class="res-foot">
          <span class="meta" id="resMeta">0/100</span>
          <button class="btn primary" id="resSaveBtn">결심 저장</button>
        </div>
      </div>

      <div class="block">
        <h2>사진 인증</h2>
        <div class="photo-frame" id="photoFrame">
          <p class="empty">공부하는 모습이나 공부한 노트를 찍어 올려 주세요.</p>
        </div>
        <div class="photo-actions">
          <button class="btn" id="camBtn">카메라로 촬영</button>
          <button class="btn" id="fileBtn">파일에서 선택</button>
        </div>
        <p class="photo-meta" id="photoMeta"></p>
        <input type="file" id="camInput" class="vh" accept="image/*" capture="environment" tabindex="-1">
        <input type="file" id="fileInput" class="vh" accept="image/*" tabindex="-1">
      </div>

      <div class="block">
        <h2>나의 기록</h2>
        <ul class="history" id="historyList"></ul>
      </div>
    </div>

    <!-- 우리 반 피드 -->
    <div id="panelFeed" role="tabpanel" aria-labelledby="tabFeed" class="hidden">
      <div class="feed-head">
        <p id="feedCount"></p>
        <button class="btn refresh" id="refreshBtn">새로고침</button>
      </div>
      <div id="feedList"></div>
    </div>
  </main>
</section>

<div id="toast" role="status" aria-live="polite"></div>
<div id="loading" class="hidden"><div class="spinner"></div><span id="loadingText">불러오는 중</span></div>
<div id="lightbox" class="hidden"><button aria-label="닫기">×</button><img alt="인증 사진 크게 보기"></div>

<script>
  const $ = id => document.getElementById(id);
  const STORE_KEY = 'morningStudyNick';
  const state = { nick: '', token: '', data: null, feedLoaded: false, setupMode: false };
  const photoCache = {};

  /* ── 서버 호출 ── */
  function call(fn, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
  }
  // 로그인 후 요청: 토큰을 붙여 보내고, 접속 시간이 지나면 첫 화면으로 돌아갑니다.
  async function authed(fn, ...args) {
    try {
      return await call(fn, state.token, ...args);
    } catch (e) {
      if (/SESSION_EXPIRED/.test(errMsg(e))) {
        resetToLogin();
        toast('접속 시간이 지났어요. 비밀번호로 다시 들어와 주세요.', true);
        throw new Error('__handled__');
      }
      throw e;
    }
  }
  function errMsg(e) {
    return String((e && e.message) || e || '').replace(/^Error:\s*/, '') || '잠시 후 다시 시도해 주세요.';
  }
  function showError(e) {
    const m = errMsg(e);
    if (m !== '__handled__') toast(m, true);
  }

  /* ── 공통 UI ── */
  let toastTimer;
  function toast(msg, isError) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.toggle('error', !!isError);
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }
  function loading(on, text) {
    $('loadingText').textContent = text || '불러오는 중';
    $('loading').classList.toggle('hidden', !on);
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function store(key, val) {
    try { val == null ? localStorage.removeItem(key) : localStorage.setItem(key, val); } catch (e) {}
  }
  function load(key) {
    try { return localStorage.getItem(key) || ''; } catch (e) { return ''; }
  }

  const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
  function dateLabel(ymd, withWeekday) {
    const [y, m, d] = ymd.split('-').map(Number);
    const w = WEEK[new Date(y, m - 1, d).getDay()];
    return withWeekday ? `${m}월 ${d}일 ${w}요일` : `${m}월 ${d}일 (${w})`;
  }

  /* ── 사진 표시 ── */
  function thumbUrl(id) {
    return photoCache[id] || 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w1200';
  }
  function photoImg(id, extra) {
    return `<img src="${esc(thumbUrl(id))}" data-id="${esc(id)}" alt="인증 사진" loading="lazy" ${extra || ''} onerror="photoFallback(this)">`;
  }
  // 드라이브 공유가 막혀 있으면 서버에서 직접 받아 옵니다.
  function photoFallback(img) {
    if (img.dataset.fb) { img.classList.add('broken'); return; }
    img.dataset.fb = '1';
    const id = img.dataset.id;
    authed('getPhotoData', id)
      .then(d => { photoCache[id] = d; img.src = d; })
      .catch(() => img.classList.add('broken'));
  }

  /* ── 로그인 ── */
  function setSetupMode(on, msg) {
    state.setupMode = on;
    $('setupBox').classList.toggle('hidden', !on);
    $('setupMsg').textContent = msg || '';
    $('pinConfirm').value = '';
    $('loginBtn').textContent = on ? '비밀번호 정하고 시작' : '시작';
  }

  async function doLogin() {
    const nick = $('nickInput').value.replace(/\s+/g, ' ').trim();
    const pin = $('pinInput').value.trim();
    if (!nick) { toast('닉네임을 입력해 주세요.', true); $('nickInput').focus(); return; }
    if (!/^\d{4}$/.test(pin)) { toast('비밀번호는 숫자 4자리로 입력해 주세요.', true); $('pinInput').focus(); return; }

    if (state.setupMode) {
      const pin2 = $('pinConfirm').value.trim();
      if (pin2 !== pin) { toast('비밀번호 확인이 일치하지 않아요.', true); $('pinConfirm').focus(); return; }
    }

    $('loginBtn').disabled = true;
    loading(true, state.setupMode ? '비밀번호를 저장하는 중' : '기록을 불러오는 중');
    try {
      const data = state.setupMode
        ? await call('register', nick, pin, $('pinConfirm').value.trim())
        : await call('login', nick, pin);

      if (data.needSetup) {
        setSetupMode(true, data.isNew
          ? `'${data.nickname}'은(는) 처음 쓰는 닉네임이에요. 방금 입력한 비밀번호를 한 번 더 입력하면 내 닉네임으로 등록돼요.`
          : `'${data.nickname}'의 비밀번호가 초기화되었어요. 새 비밀번호를 한 번 더 입력해 주세요.`);
        $('pinConfirm').focus();
        return;
      }
      enterMain(data);
    } catch (e) {
      showError(e);
      $('pinInput').value = '';
      $('pinInput').focus();
    } finally {
      loading(false);
      $('loginBtn').disabled = false;
    }
  }

  function enterMain(data) {
    state.nick = data.nickname;
    state.token = data.token;
    state.feedLoaded = false;
    store(STORE_KEY, state.nick);
    setSetupMode(false);
    $('pinInput').value = '';
    renderMy(data);
    $('loginView').classList.add('hidden');
    $('mainView').classList.remove('hidden');
    selectTab('my');
    window.scrollTo(0, 0);
  }

  function resetToLogin() {
    state.nick = ''; state.token = ''; state.data = null; state.feedLoaded = false;
    $('feedList').innerHTML = '';
    $('historyList').innerHTML = '';
    $('mainView').classList.add('hidden');
    $('loginView').classList.remove('hidden');
    setSetupMode(false);
    $('pinInput').value = '';
  }

  function logout() {
    if (state.token) call('logout', state.token).catch(() => {});
    resetToLogin();
    $('nickInput').value = '';
    $('nickInput').focus();
  }

  /* ── 나의 챌린지 ── */
  function renderMy(data, stampNow) {
    state.data = data;
    const t = data.todayRecord;
    const certified = !!(t && t.photoId);

    $('nickLabel').textContent = data.nickname;
    $('totalDays').textContent = data.totalDays;
    $('tallyMsg').textContent = certified ? '오늘 인증까지 완료했어요.' : '오늘 사진을 올리면 하루가 더해져요.';
    $('todayLabel').textContent = dateLabel(data.today, true);

    // 결심
    const res = (t && t.resolution) || '';
    if (document.activeElement !== $('resInput')) $('resInput').value = res;
    updateResMeta();
    $('resSaveBtn').textContent = res ? '결심 수정' : '결심 저장';

    // 사진
    const frame = $('photoFrame');
    if (certified) {
      frame.classList.add('filled');
      frame.innerHTML = photoImg(t.photoId, 'class="zoomable"') +
        `<div class="seal${stampNow ? ' stamp-in' : ''}" aria-label="인증 완료"><b>인증</b><span>${esc(t.certTime)}</span></div>`;
      $('photoMeta').textContent = `${t.certTime}에 인증했어요. 다시 올리면 사진이 바뀌어요.`;
    } else {
      frame.classList.remove('filled');
      frame.innerHTML = '<p class="empty">공부하는 모습이나 공부한 노트를 찍어 올려 주세요.</p>';
      $('photoMeta').textContent = '';
    }

    // 지난 기록
    const list = $('historyList');
    if (!data.history.length) {
      list.innerHTML = '<p class="empty-note">지난 기록이 여기에 쌓여요. 오늘부터 시작해 볼까요?</p>';
    } else {
      list.innerHTML = data.history.map(h => `
        <li>
          ${h.photoId
            ? `<div class="thumb">${photoImg(h.photoId, 'class="zoomable"')}<span class="mini-seal">인</span></div>`
            : '<div class="thumb none">사진 없음</div>'}
          <div class="info">
            <div class="d">${esc(dateLabel(h.date))}</div>
            <p class="r">${h.resolution ? esc(h.resolution) : '결심 없음'}</p>
          </div>
        </li>`).join('');
    }
  }

  function updateResMeta() {
    $('resMeta').textContent = `${$('resInput').value.length}/100`;
  }

  async function saveResolution() {
    const text = $('resInput').value.trim();
    if (!text) { toast('결심을 입력해 주세요.', true); $('resInput').focus(); return; }
    $('resSaveBtn').disabled = true;
    try {
      const data = await authed('saveResolution', text);
      $('resInput').blur();
      renderMy(data);
      state.feedLoaded = false;
      toast('결심을 저장했어요.');
    } catch (e) {
      showError(e);
    } finally {
      $('resSaveBtn').disabled = false;
    }
  }

  // 업로드 전에 사진을 줄여서 보냅니다 (긴 변 1280px, JPG)
  function resizeImage(file, maxSide = 1280, quality = 0.82) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        reject(new Error('이 사진은 열 수 없어요. JPG나 PNG 사진으로 올려 주세요.'));
      };
      img.src = url;
    });
  }

  async function handlePhoto(input) {
    const file = input.files && input.files[0];
    input.value = '';
    if (!file) return;
    if (!/^image\//.test(file.type) && !/\.(jpe?g|png|webp|gif|heic|heif)$/i.test(file.name)) {
      toast('사진 파일만 올릴 수 있어요.', true); return;
    }
    const t = state.data && state.data.todayRecord;
    if (t && t.photoId && !confirm('오늘 올린 사진을 새 사진으로 바꿀까요?')) return;

    loading(true, '사진 올리는 중');
    try {
      const dataUrl = await resizeImage(file);
      const data = await authed('uploadPhoto', dataUrl);
      if (data.todayRecord && data.todayRecord.photoId) photoCache[data.todayRecord.photoId] = dataUrl;
      renderMy(data, true);
      state.feedLoaded = false;
      toast(`인증 완료! 누적 ${data.totalDays}일째예요.`);
    } catch (e) {
      showError(e);
    } finally {
      loading(false);
    }
  }

  /* ── 우리 반 피드 ── */
  async function loadFeed() {
    $('refreshBtn').disabled = true;
    if (!state.feedLoaded) $('feedList').innerHTML = '<p class="empty-note">피드를 불러오는 중이에요.</p>';
    try {
      const feed = await authed('getFeed');
      renderFeed(feed);
      state.feedLoaded = true;
    } catch (e) {
      showError(e);
    } finally {
      $('refreshBtn').disabled = false;
    }
  }

  function renderFeed(feed) {
    $('feedCount').innerHTML = `오늘 <strong>${feed.todayCount}명</strong>이 인증했어요`;
    if (!feed.items.length) {
      $('feedList').innerHTML = '<p class="empty-note">아직 올라온 인증이 없어요. 오늘의 첫 인증을 남겨 보세요.</p>';
      return;
    }
    let html = '', lastDate = '';
    feed.items.forEach(it => {
      if (it.date !== lastDate) {
        lastDate = it.date;
        html += `<h3 class="day-label">${it.date === feed.today ? '오늘' : esc(dateLabel(it.date))}</h3>`;
      }
      const time = it.certTime || it.resTime;
      html += `
        <article class="post">
          <div class="post-head">
            <div class="avatar" aria-hidden="true">${esc(Array.from(it.nickname)[0] || '?')}</div>
            <div>
              <div class="who">${esc(it.nickname)}</div>
              <div class="when">${esc(time)}</div>
            </div>
            ${it.photoId ? '<span class="state done">인증 완료</span>' : '<span class="state wait">결심만 작성</span>'}
          </div>
          ${it.resolution ? `<p class="res">${esc(it.resolution)}</p>` : ''}
          ${it.photoId ? `<div class="pic">${photoImg(it.photoId, 'class="zoomable"')}</div>` : ''}
        </article>`;
    });
    $('feedList').innerHTML = html;
  }

  /* ── 탭 ── */
  function selectTab(name) {
    const my = name === 'my';
    $('tabMy').setAttribute('aria-selected', my);
    $('tabFeed').setAttribute('aria-selected', !my);
    $('panelMy').classList.toggle('hidden', !my);
    $('panelFeed').classList.toggle('hidden', my);
    if (!my && !state.feedLoaded) loadFeed();
  }

  /* ── 이벤트 ── */
  $('loginBtn').addEventListener('click', doLogin);
  $('nickInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) $('pinInput').focus(); });
  $('changeBtn').addEventListener('click', logout);
  $('pinInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  $('pinConfirm').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  // 숫자만 입력되도록
  ['pinInput', 'pinConfirm'].forEach(id => $(id).addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4); }));
  // 닉네임을 바꾸면 새 닉네임 등록 단계를 취소
  $('nickInput').addEventListener('input', () => { if (state.setupMode) setSetupMode(false); });
  $('tabMy').addEventListener('click', () => selectTab('my'));
  $('tabFeed').addEventListener('click', () => selectTab('feed'));
  $('resInput').addEventListener('input', updateResMeta);
  $('resSaveBtn').addEventListener('click', saveResolution);
  $('camBtn').addEventListener('click', () => $('camInput').click());
  $('fileBtn').addEventListener('click', () => $('fileInput').click());
  $('camInput').addEventListener('change', e => handlePhoto(e.target));
  $('fileInput').addEventListener('change', e => handlePhoto(e.target));
  $('refreshBtn').addEventListener('click', loadFeed);

  document.addEventListener('click', e => {
    const img = e.target.closest('img.zoomable');
    if (!img || img.classList.contains('broken')) return;
    $('lightbox').querySelector('img').src = img.src;
    $('lightbox').classList.remove('hidden');
  });
  $('lightbox').addEventListener('click', () => $('lightbox').classList.add('hidden'));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') $('lightbox').classList.add('hidden'); });

  // 이 기기에서 쓰던 닉네임을 미리 채워 둡니다 (입력은 학생이 직접 확인 후 시작).
  $('nickInput').value = load(STORE_KEY);
</script>
</body>
</html>
